name: Deploy to VM

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for Workload Identity Federation

env:
  GCP_PROJECT: syncplay-custom
  GCP_ZONE: us-central1-a
  VM_NAME: syncplay-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Stage release on the VM
        run: |
          set -euo pipefail
          RELEASE_ID="${{ github.sha }}"
          gcloud compute ssh "$VM_NAME" \
            --zone="$GCP_ZONE" --tunnel-through-iap \
            --command="mkdir -p /opt/karara-app/incoming/$RELEASE_ID/app"
          gcloud compute scp --recurse --tunnel-through-iap --zone="$GCP_ZONE" \
            app/. "$VM_NAME:/opt/karara-app/incoming/$RELEASE_ID/app"

      - name: Promote + restart (deploy.sh runs as root via a sudoers rule scoped to this exact command)
        run: |
          set -euo pipefail
          RELEASE_ID="${{ github.sha }}"
          gcloud compute ssh "$VM_NAME" \
            --zone="$GCP_ZONE" --tunnel-through-iap \
            --command="sudo /opt/karara-app/deploy.sh $RELEASE_ID"
